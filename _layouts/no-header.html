<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main-additions.css' | relative_url }}">
    {% if page.custom_css %}
    <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
    {% endif %}
    {% if page.google_fonts %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="{{ page.google_fonts }}" rel="stylesheet">
    {% endif %}
    {% seo %}
    {% feed_meta %}
</head>
<body>
    <main id="container" class="landing-page">
        <div id="main-content">
            {{ content }}
        </div>
    </main>
    
    {% include footer.html %}
</body>
</html>
